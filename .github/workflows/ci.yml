name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and assemble debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Lint, unit test and assemble debug
        id: gate
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-ci.log"
        timeout-minutes: 30
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # The Actions log endpoint needs authentication, so on failure republish the
      # tail through the step summary and a check annotation, both of which are
      # readable for public repositories.
      - name: Publish failure tail
        if: failure() && steps.gate.outcome == 'failure'
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle-ci.log"
          if [ ! -f "$LOG" ]; then
            echo "no gradle log captured"
            exit 0
          fi
          {
            echo '### Gradle failure tail'
            echo '```text'
            tail -n 120 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          TAIL=$(tail -n 30 "$LOG" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NR>1{printf "%0A"} {printf "%s", $0}')
          echo "::error title=Gradle failure tail::${TAIL}"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7