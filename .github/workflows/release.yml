name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/goodsbuy-release.jks"
          if [[ -n "$SIGNING_KEY" && -n "$SIGNING_ALIAS" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the configured persistent release signing key."
          else
            TEMP_PASSWORD=$(openssl rand -hex 24)
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias goodsbuy-release \
              -keyalg RSA -keysize 4096 -validity 3650 \
              -dname "CN=GoodsBuy CI Release"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=goodsbuy-release" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "::warning::Persistent Android signing secrets are not configured. This APK requires a clean install."
          fi
          echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Test and build Release APK
        run: ./gradlew testDebugUnitTest assembleRelease
        timeout-minutes: 30
        env:
          ANDROID_COMPILE_SDK: "34"
          ANDROID_BUILD_TOOLS: "34.0.0"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Verify and name APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          OUTPUT_APK="app/build/outputs/apk/release/goods-collector-v${{ steps.version.outputs.version }}.apk"
          test -s "$SOURCE_APK"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          echo "path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: goods-collector-v${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
